name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Which torch/torchvision wheel (CPU-only vs CUDA, multi-GB) you get
      # depends entirely on which index you install from -- never rely on a
      # bare `pip install` to pick the right one. Installed first, explicitly
      # from the CPU-only index (this runner has no GPU to use anyway), at
      # the exact pinned version from requirements.txt, so the later full
      # install is a no-op for these two packages instead of pulling a
      # different, unwanted wheel.
      - name: Install CPU-only torch/torchvision
        run: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker-build:
    # No Docker available in this project's local dev environment to
    # verify the Dockerfile builds/runs at all -- ubuntu-latest runners
    # have Docker preinstalled, so this is the actual verification for it,
    # run on every push/PR instead of a one-off manual check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t autocim-agent .

      - name: Smoke test the built image
        # --help needs no API key/model/network -- just proves the image's
        # Python env + entrypoint actually run, not only that `docker build`
        # succeeded.
        run: docker run --rm autocim-agent --help
